<style>
/* Layout: cuaderno de estudio — barra de filtros fija arriba, columna de lectura de ~70ch; en modo test, una tarjeta centrada. */
:root {
  --paper: #fbfaf6; --ink: #1d2230; --muted: #646a78; --line: #dcd9cf; --card: #ffffff;
  --accent: #1f4e79; --accent-soft: #e6eef6; --ok: #1b7a3a; --ok-soft: #e3f3e7; --bad: #b3261e; --bad-soft: #fbe6e3;
  --note: #fff3b8; --note-ink: #4a3f00;
  --display: "Newsreader", "Georgia", "Times New Roman", serif;
  --ui: "Public Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --c0: #F5D300; --c1: #4FD45A; --c2: #FF6CB4; --c3: #35B4F0; --c4: #FF9B2F; --c5: #A57BFF; --c6: #22D1AC; --c7: #FF7660;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #14171e; --ink: #e6e8ee; --muted: #9aa1b0; --line: #2c313c; --card: #1b1f28;
  --accent: #8cb8e6; --accent-soft: #1f2a3a; --ok: #6fd28d; --ok-soft: #173023; --bad: #ff8a80; --bad-soft: #3a1d1b;
  --note: #3b3410; --note-ink: #f3e7a8; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #14171e; --ink: #e6e8ee; --muted: #9aa1b0; --line: #2c313c; --card: #1b1f28;
  --accent: #8cb8e6; --accent-soft: #1f2a3a; --ok: #6fd28d; --ok-soft: #173023; --bad: #ff8a80; --bad-soft: #3a1d1b;
  --note: #3b3410; --note-ink: #f3e7a8; color-scheme: dark }

body { background: var(--paper); color: var(--ink); font-family: var(--ui); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { padding-block: 22px 8px; }
.eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 5vw, 36px); line-height: 1.12; margin: 4px 0 6px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; max-width: 62ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 12px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 10px; }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; background: var(--card); color: var(--ink); font: 600 14px var(--ui); padding: 7px 14px; cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
select, input[type="search"] { font: 14px var(--ui); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; min-width: 0; }
input[type="search"] { flex: 1 1 180px; }
label.chk { font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, .opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { padding-block: 14px 48px; }
.count { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
.section { font-family: var(--display); font-size: 19px; font-weight: 600; margin: 22px 0 8px; color: var(--accent); }
.q { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0 0 10px; }
.qhead { display: flex; gap: 10px; align-items: flex-start; }
.tag { flex: none; font: 700 12px var(--ui); color: #151515; border-radius: 5px; padding: 2px 7px; border: 1px solid rgba(0,0,0,.35); font-variant-numeric: tabular-nums; }
.qtext { font-family: var(--display); font-size: 17.5px; line-height: 1.35; font-weight: 600; min-width: 0; }
.meta { font-size: 12.5px; color: var(--muted); margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 4px 12px; }
.pill { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; border-radius: 99px; padding: 1px 8px; }
.pill.ex { background: var(--accent-soft); color: var(--accent); }
.pill.au { background: var(--line); color: var(--ink); }
.pill.fa { background: var(--bad-soft); color: var(--bad); }
.opts { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; }
.opt { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: var(--paper); text-align: left; font: 15px/1.4 var(--ui); color: var(--ink); width: 100%; }
button.opt { cursor: pointer; }
button.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .l { font-weight: 700; color: var(--muted); flex: none; }
.opt.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); font-weight: 600; }
.opt.ok .l { color: var(--ok); }
.opt.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.expl { margin: 10px 0 0; font-size: 14px; display: grid; gap: 6px; }
.expl p { margin: 0; }
.expl .nota { background: var(--note); color: var(--note-ink); border-radius: 6px; padding: 5px 9px; font-size: 13.5px; }
.where { font-size: 13px; color: var(--muted); }
.reveal { margin-top: 8px; font: 600 13px var(--ui); background: none; border: 0; color: var(--accent); cursor: pointer; padding: 2px 0; }

/* modo test */
.test { max-width: 720px; margin: 0 auto; }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 4px 0 14px; }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.testbar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { font: 600 14px var(--ui); border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--paper); }
.btn.ghost { background: var(--card); color: var(--accent); }
.result { text-align: center; padding: 28px 16px; }
.result .big { font-family: var(--display); font-size: 54px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.empty { color: var(--muted); padding: 24px 0; }
@media (prefers-reduced-motion: reduce) { .progress span { transition: none; } }
@media (max-width: 520px) { .qtext { font-size: 16.5px; } .tabs button { padding: 7px 11px; } }
</style>

body{margin:0}

<script>
const Q = [{"n":1,"enunciado":"En el procesamiento semántico de las palabras, reconocer una palabra y acceder a su significado:","opciones":["Son procesos distintos.","Dependen de la misma área cerebral.","No dan lugar a disociaciones en pacientes afásicos."],"correcta":1,"origen":"Examen 2020, septiembre, preg. 11","tipo":"examen","anio":2020,"convocatoria":"S","apartado":"Introducción","pagina_libro":171,"margen":"izquierdo","por_que":"b) y c) son lo contrario de lo que dice el libro: son procesos que dependen de áreas cerebrales diferentes, y por eso los afásicos muestran disociaciones entre palabras y significados.","nota":"Misma pregunta que P2.","falsa":false,"verdaderas":{}},{"n":2,"enunciado":"En el procesamiento semántico de las palabras, reconocer una palabra y acceder a su significado:","opciones":["Son procesos distintos.","Dependen de la misma área cerebral.","No dan lugar a disociaciones en pacientes afásicos."],"correcta":1,"origen":"Examen 2022, 2.ª semana, preg. 12","tipo":"examen","anio":2022,"convocatoria":"2","apartado":"Introducción","pagina_libro":171,"margen":"izquierdo","por_que":"b) y c) son lo contrario de lo que dice el libro: dependen de áreas cerebrales diferentes y dan lugar a disociaciones en los afásicos.","nota":"Misma pregunta que P1.","falsa":false,"verdaderas":{}},{"n":3,"enunciado":"Siguiendo la distinción planteada por el filósofo Locke, fundamental para el procesamiento semantico, podemos diferenciar entre:","opciones":["La intensión (conjunto de rasgos definitorios que ha de reunir un objeto para ser incluido dentro de una categoria) y la extension (conjunto de rasgos caracteristicos que puede tener un objeto de una categoria).","La intensión de la palabra (el significado de esta y las caracteristicas que tiene que reunir un objeto para incluirlo como miembro de esa clase o concepto) y la extensión (conjunto de objetos que tienen esas propiedades).","La intensión (conjunto de atributos tipicos que reune un objeto de una determinada categoria) y la extension (grado de prototipicidad o representatividad que tiene un objeto determinado dentro de una categoria)."],"correcta":2,"origen":"Examen 2026, 1.ª semana, preg. 20","tipo":"examen","anio":2026,"convocatoria":"1","apartado":"Introducción","pagina_libro":172,"margen":"izquierdo","por_que":"a) y c) cambian el significado de los términos: la extensión no es un conjunto de rasgos ni un grado de tipicidad, sino el conjunto de objetos que cumplen las propiedades del concepto.","nota":null,"falsa":false,"verdaderas":{}},{"n":4,"enunciado":"En semántica se distingue entre:","opciones":["Denotación y connotación: la primera hace alusión a conceptos cuyos referentes son imaginables y la connotación a los conceptos cuyos referentes son inimaginables y abstractos.","Denotación y connotación: la primera se refiere al uso de un concepto para describir sus cualidades y la segunda al uso de un concepto como cualidad de algo.","Denotación y connotación: la primera hace alusión al significado objetivo de un concepto y la segunda al conjunto de implicaciones subjetivas que puede tener un concepto."],"correcta":3,"origen":"Examen 2026, 2.ª semana, preg. 19","tipo":"examen","anio":2026,"convocatoria":"2","apartado":"Introducción","pagina_libro":172,"margen":"izquierdo","por_que":"a) y b) no son la distinción del libro: la denotación es el significado objetivo (lo que dice el diccionario) y la connotación, las implicaciones emocionales y subjetivas.","nota":null,"falsa":false,"verdaderas":{}},{"n":5,"enunciado":"Uno de los problemas de la teoría referencial del significado es que:","opciones":["Presenta problemas con las palabras abstractas, pero también con las palabras concretas que no se refieren a un objeto o realidad individual y específica.","No todas las palabras tienen significado.","No hay un solo referente común para todos los hablantes."],"correcta":1,"origen":"Examen 2025, 1.ª semana, preg. 3","tipo":"examen","anio":2025,"convocatoria":"1","apartado":"Introducción","pagina_libro":172,"margen":"izquierdo","por_que":"b) y c) no son la objeción del libro: el problema es que las palabras abstractas no tienen referente y que incluso las concretas («perro») no se refieren a un objeto individual, sino a un concepto.","nota":null,"falsa":false,"verdaderas":{}},{"n":6,"enunciado":"Si yo he leído en el periódico del 1 de junio de 2017 que a la investigadora Karen Armstrong se le ha concedido el Premio Princesa de Asturias de Ciencias Sociales, estoy activando:","opciones":["El conocimiento de la memoria episódica.","El conocimiento de la memoria procedimental.","Todas las opciones son falsas."],"correcta":1,"origen":"Examen 2018, 1.ª semana, preg. 29","tipo":"examen","anio":2018,"convocatoria":"1","apartado":"Introducción","pagina_libro":172,"margen":"derecho","por_que":"b) La memoria procedimental es saber hacer cosas, no recordar un hecho concreto. c) No es cierto: es un recuerdo ligado a un momento y lugar (episódico).","nota":"Es una pregunta de aplicación: el libro distingue memoria episódica (un evento concreto) y semántica (conocimiento desligado de tiempo y lugar), siguiendo a Tulving (1972).","falsa":false,"verdaderas":{}},{"n":7,"enunciado":"Para el estudio del procesamiento semántico, la tarea más utilizada es:","opciones":["La de decisión léxica","La categorización semántica.","La verificación de frases"],"correcta":2,"origen":"Examen 2024, 1.ª semana, preg. 3","tipo":"examen","anio":2024,"convocatoria":"1","apartado":"Metodologías de investigación","pagina_libro":173,"margen":"izquierdo","por_que":"a) La decisión léxica es la tarea más usada para el reconocimiento de palabras, no para el sistema semántico. c) La verificación de frases se usa, pero no es la más utilizada.","nota":null,"falsa":false,"verdaderas":{}},{"n":8,"enunciado":"En Psicología del Lenguaje, la tarea más utilizada para el estudio del sistema semántico es:","opciones":["La verificación de frases.","La asociación de palabras.","La categorización semántica."],"correcta":3,"origen":"Examen 2024, septiembre, preg. 9","tipo":"examen","anio":2024,"convocatoria":"S","apartado":"Metodologías de investigación","pagina_libro":173,"margen":"izquierdo","por_que":"a) y b) se usan también, pero el libro dice que la más utilizada es la categorización semántica.","nota":null,"falsa":false,"verdaderas":{}},{"n":9,"enunciado":"¿Cómo se denomina la tarea consistente en decir si un concepto pertenece o no a una categoría semántica determinada?","opciones":["Decisión léxica.","Categorización semántica.","Fluidez semántica.","Asociación semántica."],"correcta":2,"origen":"Autoevaluación T6 (psicomagnum), preg. 2","tipo":"autoevaluacion","anio":null,"convocatoria":null,"apartado":"Metodologías de investigación","pagina_libro":173,"margen":"izquierdo","por_que":"a) La decisión léxica es decidir si una palabra es real. c) La fluidez es nombrar ejemplares durante un minuto. d) La asociación es indicar qué estímulo se relaciona con otro.","nota":null,"falsa":false,"verdaderas":{}},{"n":10,"enunciado":"En una tarea experimental de categorización semántica las latencias de respuesta que se obtienen son:","opciones":["Más largas que las que se obtienen en la de decisión léxica.","Más cortas que las que se obtienen en la decisión léxica.","Similares a las que se obtienen en la decisión léxica."],"correcta":1,"origen":"Examen 2018, septiembre, preg. 11","tipo":"examen","anio":2018,"convocatoria":"S","apartado":"Metodologías de investigación","pagina_libro":173,"margen":"izquierdo","por_que":"b) y c) son al revés: la categorización exige un paso más (acceder al significado), por lo que sus latencias son más largas.","nota":null,"falsa":false,"verdaderas":{}},{"n":11,"enunciado":"Si comparamos las latencias que se obtienen en las tareas de categorización semántica con las de las tareas de decisión léxica:","opciones":["No hay un patrón general.","Son más largas las primeras que las segundas.","Son más largas las segundas que las primeras."],"correcta":2,"origen":"Examen 2025, 2.ª semana, preg. 16","tipo":"examen","anio":2025,"convocatoria":"2","apartado":"Metodologías de investigación","pagina_libro":173,"margen":"izquierdo","por_que":"a) Sí hay un patrón. c) Es al revés: las de categorización son más largas porque exige acceder al significado.","nota":null,"falsa":false,"verdaderas":{}},{"n":12,"enunciado":"El tiempo de latencia en la tarea de decisión léxica, respecto al de categorización semántica, es:","opciones":["Más corto.","Igual.","Más largo."],"correcta":1,"origen":"Examen 2026, 2.ª semana, preg. 20","tipo":"examen","anio":2026,"convocatoria":"2","apartado":"Metodologías de investigación","pagina_libro":173,"margen":"izquierdo","por_que":"b) y c) son al revés: la decisión léxica no requiere acceder al significado y por eso es más rápida.","nota":null,"falsa":false,"verdaderas":{}},{"n":13,"enunciado":"La tarea de verificación de frases permite evaluar:","opciones":["La memoria semántica.","La memoria procedimental.","La memoria episódica."],"correcta":1,"origen":"Examen 2013, 1.ª semana, preg. 19","tipo":"examen","anio":2013,"convocatoria":"1","apartado":"Metodologías de investigación","pagina_libro":173,"margen":"izquierdo","por_que":"b) y c) no: la verificación de frases se usa para estudiar el sistema semántico (memoria semántica).","nota":null,"falsa":false,"verdaderas":{}},{"n":14,"enunciado":"La tarea de verificación de frases permite evaluar:","opciones":["La memoria semántica.","La memoria procedimental.","La memoria prospectiva."],"correcta":1,"origen":"Examen 2015, 2.ª semana, preg. 19","tipo":"examen","anio":2015,"convocatoria":"2","apartado":"Metodologías de investigación","pagina_libro":173,"margen":"izquierdo","por_que":"b) y c) no: la verificación de frases se usa para estudiar el sistema semántico (memoria semántica).","nota":null,"falsa":false,"verdaderas":{}},{"n":15,"enunciado":"La tarea de verificación de frases, es utilizada para evaluar:","opciones":["El sistema semántico.","La comprensión morfológica.","El acceso al léxico."],"correcta":1,"origen":"Examen 2023, 1.ª semana, preg. 28","tipo":"examen","anio":2023,"convocatoria":"1","apartado":"Metodologías de investigación","pagina_libro":173,"margen":"izquierdo","por_que":"b) y c) no: la verificación de frases es una de las tareas para estudiar el sistema semántico, no la morfología ni el acceso léxico.","nota":null,"falsa":false,"verdaderas":{}},{"n":16,"enunciado":"Indique la tarea que se utiliza principalmente con pacientes con trastornos semánticos y no tanto en laboratorio:","opciones":["La verificación de frases.","La categorización semántica.","La asociación semántica."],"correcta":3,"origen":"Examen 2019, 1.ª semana, preg. 7","tipo":"examen","anio":2019,"convocatoria":"1","apartado":"Metodologías de investigación","pagina_libro":173,"margen":"derecho","por_que":"a) y b) se usan sobre todo en laboratorio. La asociación semántica (y la fluidez) se usan con pacientes con trastornos semánticos.","nota":null,"falsa":false,"verdaderas":{}},{"n":17,"enunciado":"Los datos del estudio pionero de Kent y Rosanoff (1910) con una tarea de asociación semántica revelaron que las respuestas de los participantes se basaban en cuatro tipos de relaciones asociativas. Indique, por favor, cuál de ellas no se encontró:","opciones":["Términos funcionales.","Relaciones taxonómicas.","Relaciones de forma perceptiva."],"correcta":3,"origen":"Examen 2020, 1.ª semana, preg. 15","tipo":"examen","anio":2020,"convocatoria":"1","apartado":"Metodologías de investigación","pagina_libro":174,"margen":"izquierdo","por_que":"a) y b) sí se encontraron: los cuatro tipos son relaciones taxonómicas, atributos, partes del objeto y términos funcionales. Nadie respondió por semejanza de forma o sonido.","nota":"Misma pregunta que P18.","falsa":false,"verdaderas":{}},{"n":18,"enunciado":"Los datos del estudio pionero de Kent y Rosanoff (1910) con una tarea de asociación semántica revelaron que las respuestas ición central."],"correcta":1,"origen":"Examen 2026, 1.ª semana, preg. 21","tipo":"examen","anio":2026,"convocatoria":"1","apartado":"Teorías cognitivas: teorías de redes","pagina_libro":178,"margen":"derecho","por_que":"b) Eso es la teoría de rasgos. c) Eso es la teoría de prototipos.","nota":null,"falsa":false,"verdaderas":{}},{"n":44,"enunciado":"Una de estas afirmaciones sobre los modelos semánticos es falsa. Señálela:","opciones":["En el modelo de Collins y Quillian (1969), en los niveles más bajos de la red se encuentran los conceptos más específicos.","En el modelo de rasgos de Smith et al. (1974), en el segundo estadio, se comparan sólo los rasgos característicos.","En el modelo de prototipos de Rosch (1975) los límites entre las categorías son difusos.","En el modelo de Collins y Loftus (1975) la tipicidad se explica por la proximidad de los conceptos."],"correcta":2,"origen":"Autoevaluación T6 (psicomagnum), preg. 7","tipo":"autoevaluacion","anio":null,"convocatoria":null,"apartado":"Teorías cognitivas: teorías de redes","pagina_libro":182,"margen":"derecho","por_que":"a), c) y d) son verdaderas. La falsa es b): en el segundo estadio se comparan solo los rasgos definitorios, no los característicos.","nota":null,"falsa":true,"verdaderas":{"a":178,"c":184,"d":181}},{"n":45,"enunciado":"En el contexto de las teorías de redes sobre la organización conceptual, los experimentos realizados por Collins y Quillian (1969) han utilizado la tarea de verificación de oraciones, con oraciones como: 1) una sardina es una sardina; 2) una sardina es un pez; 3) una sardina es un animal; 4) una sardina es un ave. Elija la opción que recoge la oración en la que el tiempo de respuesta es mayor:","opciones":["3)","4)","2)"],"correcta":2,"origen":"Examen 2023, 1.ª semana, preg. 8","tipo":"examen","anio":2023,"convocatoria":"1","apartado":"Teorías cognitivas: teorías de redes","pagina_libro":179,"margen":"izquierdo","por_que":"a) y c) son verdaderas y, por tanto, más rápidas. La 4) es falsa: hay que recorrer toda la red sin encontrarla, y es la que más tarda.","nota":null,"falsa":false,"verdaderas":{}},{"n":46,"enunciado":"En el procesamiento semántico, según el modelo de Collins y Quillian (1969), a mayor distancia semántica entre el concepto y la categoría, el tiempo que se tarda en la verificación de la frase es:","opciones":["Menor.","Mayor.","Dependiente del participante."],"correcta":2,"origen":"Examen 2018, 2.ª semana, preg. 20","tipo":"examen","anio":2018,"convocatoria":"2","apartado":"Teorías cognitivas: teorías de redes","pagina_libro":179,"margen":"izquierdo","por_que":"a) y c) no: a mayor distancia semántica, mayor tiempo de verificación.","nota":null,"falsa":false,"verdaderas":{}},{"n":47,"enunciado":"En la teoría de redes, si en una tarea se presenta la frase “El gato es un felino” el tiempo de reacción para verificar, o no, lo frase sería:","opciones":["Mayor que el tiempo de reacción de la frase “El gato es un animal”.","Igual que el tiempo de reacción de la frase “El gato es un animal”","Menor que el tiempo de reacción de la frase “El gato es un animal”."],"correcta":3,"origen":"Examen 2024, 2.ª semana, preg. 7","tipo":"examen","anio":2024,"convocatoria":"2","apartado":"Teorías cognitivas: teorías de redes","pagina_libro":179,"margen":"izquierdo","por_que":"a) y b) no: felino está más cerca de gato que animal, así que se verifica antes.","nota":"Pregunta de aplicación del modelo de Collins y Quillian (más nodos = más tiempo).","falsa":false,"verdaderas":{}},{"n":48,"enunciado":"¿Cuál de estas tres oraciones tendrá tiempos de verificación menores según el modelo de Collins y Quillian, 1969?","opciones":["El canguro es un mamífero.","El canguro es un animal.","El canguro es un ser vivo.","El canguro es un vegetal."],"correcta":1,"origen":"Autoevaluación T6 (psicomagnum), preg. 6","tipo":"autoevaluacion","anio":null,"convocatoria":null,"apartado":"Teorías cognitivas: teorías de redes","pagina_libro":179,"margen":"izquierdo","por_que":"b) y c) están a más nodos de distancia. d) es falsa, y las falsas son las que más tardan.","nota":"Pregunta de aplicación del modelo de Collins y Quillian.","falsa":false,"verdaderas":{}},{"n":49,"enunciado":"El modelo de redes semánticas de Collins y Quillian (1969) tiene dificultades para explicar algunos fenómenos. Sólo explica uno de los cuatro siguientes. ¿Cuál?","opciones":["Cómo es la organización jerárquica de los conceptos abstractos.","Por qué se tarda menos en responder a los ejemplares típicos.","Por qué se producen diferentes tiempos con las oraciones falsas.","Por qué se tarda menos en responder a una característica directamente ligada al concepto que a una propiedad característica."],"correcta":4,"origen":"Autoevaluación T5 (psicomagnum), preg. 3","tipo":"autoevaluacion","anio":null,"convocatoria":null,"apartado":"Teorías cognitivas: teorías de redes","pagina_libro":179,"margen":"izquierdo","por_que":"a), b) y c) son precisamente las limitaciones del modelo: conceptos abstractos, efecto de tipicidad y latencias distintas en las frases falsas.","nota":null,"falsa":false,"verdaderas":{}},{"n":50,"enunciado":"Según la teoría de redes del procesamiento semántico, en una tarea de verificación de frases:","opciones":["El tiempo de respuesta es independiente a la distancia entre los nodos.","El tiempo de respuesta aumenta cuantos más nodos hay que recorrer.","No hay una relación entre la distancia entre nodos y el tiempo de respuesta."],"correcta":2,"origen":"Examen 2025, 1.ª semana, preg. 4","tipo":"examen","anio":2025,"convocatoria":"1","apartado":"Teorías cognitivas: teorías de redes","pagina_libro":179,"margen":"izquierdo","por_que":"a) y c) contradicen el modelo: el tiempo aumenta cuantos más nodos hay que recorrer.","nota":null,"falsa":false,"verdaderas":{}},{"n":51,"enunciado":"Según los estudios de redes semánticas (memoria semántica), el tiempo que necesitamos para rechazar la verificación semántica de “Un roble es una mesa” es respecto al de “Un roble es una flor”:","opciones":["Mayor.","Menor.","El mismo."],"correcta":2,"origen":"Examen 2013, 2.ª semana, preg. 1","tipo":"examen","anio":2013,"convocatoria":"2","apartado":"Teorías cognitivas: teorías de redes","pagina_libro":180,"margen":"derecho","por_que":"a) y c) no: cuanto menos relacionados están los conceptos, antes se rechaza la frase falsa («mesa» está más lejos de «roble» que «flor»).","nota":"El libro usa el ejemplo «Un pino es una iglesia / Un pino es una flor» (Wilkins, 1971).","falsa":false,"verdaderas":{}},{"n":52,"enunciado":"En el modelo de propagación de la activación, propuesto por Collins y Loftus (1975), con tareas de verificación de oraciones del tipo: 1) la margarita es un colegio; 2) la margarita es un árbol; 3) la margarita es una flor, se ha constado que la latencia de respuesta es mayor en:","opciones":["1)","2)","3)"],"correcta":2,"origen":"Examen 2023, 2.ª semana, preg. 9","tipo":"examen","anio":2023,"convocatoria":"2","apartado":"Teorías cognitivas: teorías de redes","pagina_libro":181,"margen":"izquierdo","por_que":"a) «colegio» no tiene relación y se rechaza antes. c) es verdadera. La 2) es falsa pero cercana (árbol-margarita), por eso tarda más.","nota":"Pregunta de aplicación con el ejemplo del pino del libro.","falsa":false,"verdaderas":{}},{"n":53,"enunciado":"Los problemas principales del modelo de Collins y Loftus (1975) en la representación del significado de las palabras fueron:","opciones":["La frecuencia conjunta.","El efecto del prototipo.","La dificultad para contrastarlo."],"correcta":3,"origen":"Examen 2012, septiembre, preg. 11","tipo":"examen","anio":2012,"convocatoria":"S","apartado":"Teorías cognitivas: teorías de redes","pagina_libro":181,"margen":"izquierdo","por_que":"a) y b) no: la principal limitación del modelo es su generalidad, que lo hace difícil de poner a prueba.","nota":null,"falsa":false,"verdaderas":{}},{"n":54,"enunciado":"En el tema del significado de las palabras, el problema del modelo de red semántica de Collins y Loftus (1975) es el siguiente:","opciones":["Es difícil hacer experimentos que lo falseen.","Tiene muchos postulados.","La estructura no es jerárquica."],"correcta":1,"origen":"Examen 2016, 2.ª semana, preg. 12","tipo":"examen","anio":2016,"convocatoria":"2","apartado":"Teorías cognitivas: teorías de redes","pagina_libro":181,"margen":"izquierdo","por_que":"b) No es eso lo que se critica. c) Que no sea jerárquico es una característica del modelo, no su problema.","nota":null,"falsa":false,"verdaderas":{}},{"n":55,"enunciado":"Según la teoría de rasgos de Smith etal. (1974) del procesamiento semántico, hay dos tipos de rasgos:","opciones":["Suficientes y necesarios.","Probabilísticos y definitivos.","Definitorios y característicos."],"correcta":3,"origen":"Examen 2025, 2.ª semana, preg. 17","tipo":"examen","anio":2025,"convocatoria":"2","apartado":"Teorías cognitivas: teorías de rasgos","pagina_libro":181,"margen":"derecho","por_que":"a) y b) no: el modelo distingue rasgos definitorios y característicos.","nota":null,"falsa":false,"verdaderas":{}},{"n":56,"enunciado":"En el procesamiento semántico, según la teoría de prototipos de Rosch (1973), los objetos se agrupan:","opciones":["Según la conexión entre los nodos.","Con categorías que tienen límites claros.","Todas las opciones son incorrectas."],"correcta":3,"origen":"Examen 2023, septiembre, preg. 6","tipo":"examen","anio":2023,"convocatoria":"S","apartado":"Teorías cognitivas: teoría de prototipos","pagina_libro":183,"margen":"derecho","por_que":"a) La conexión entre nodos es de las teorías de redes. b) Es al revés: las categorías tienen límites difusos. Se agrupan por semejanza familiar.","nota":null,"falsa":false,"verdaderas":{}},{"n":57,"enunciado":"¿Qué plantea la teoría de los prototipos de Eleanor Rosch (1973) en el procesamiento semántico?","opciones":["Que todos los miembros de una categoría comparten los mismos rasgos esenciales.","Que los miembros de una categoría se agrupan en función de su frecuencia de uso en contextos lingüísticos.","Que hay miembros más representativos dentro de una categoría, lo que es ventajoso para su procesamiento."],"correcta":3,"origen":"Examen 2025, septiembre, preg. 26","tipo":"examen","anio":2025,"convocatoria":"S","apartado":"Teorías cognitivas: teoría de prototipos","pagina_libro":184,"margen":"izquierdo","por_que":"a) Eso sería la teoría de rasgos (rasgos que comparten todos). b) No es lo que dice la teoría.","nota":null,"falsa":false,"verdaderas":{}},{"n":58,"enunciado":"Según la teoría de prototipos, ante una tarea de verificación de frases, el procesamiento es más rápido cuando el ejemplar es:","opciones":["Atípico o se encuentra en las categorías periféricas.","De una categoría subordinada.","Muy típico dentro de una categoría."],"correcta":3,"origen":"Examen 2019, 2.ª semana, preg. 25","tipo":"examen","anio":2019,"convocatoria":"2","apartado":"Teorías cognitivas: teoría de prototipos","pagina_libro":184,"margen":"izquierdo","por_que":"a) y b) no: cuanto más típico o central es un ejemplar, menos tiempo se tarda en responder.","nota":null,"falsa":false,"verdaderas":{}},{"n":59,"enunciado":"Los resultados de Barsalou (1985) acerca de las categorías que construimos ad hoc orientadas a una meta nos indican que:","opciones":["Los juicios de tipicidad no son fijos.","Los juicios de tipicidad no varían según el contexto.","Todas las opciones son correctas."],"correcta":1,"origen":"Examen 2017, 2.ª semana, preg. 12","tipo":"examen","anio":2017,"convocatoria":"2","apartado":"Teorías cognitivas: teoría de prototipos","pagina_libro":184,"margen":"izquierdo","por_que":"b) Es al revés: varían según el contexto. c) Por tanto no son ambas correctas.","nota":null,"falsa":false,"verdaderas":{}},{"n":60,"enunciado":"Los resultados de Barsalou (1985) acerca de las categorías que construimos “ad hoc” orientadas a una meta (por ejemplo, “objetos que llevamos al Rastrillo de Navidad”) nos indican que:","opciones":["Los juicios de tipicidad no varían según el contexto.","Los juicios de tipicidad no son fijos.","Todas las opciones son correctas."],"correcta":2,"origen":"Examen 2018, 1.ª semana, preg. 20","tipo":"examen","anio":2018,"convocatoria":"1","apartado":"Teorías cognitivas: teoría de prototipos","pagina_libro":184,"margen":"izquierdo","por_que":"a) Es al revés: varían según el contexto. c) Por tanto no son ambas correctas.","nota":"Misma pregunta que P61.","falsa":false,"verdaderas":{}},{"n":61,"enunciado":"Los resultados de Barsalou (1985) acerca de las categorías que construimos ad hoc orientadas a una meta (por ejemplo, objetos que llevamos al rastrillo de Navidad) nos indican que:","opciones":["los juicios de tipicidad no varían según el contexto.","los juicios de tipicidad no son fijos.","todas las opciones son correctas."],"correcta":2,"origen":"Examen 2022, 1.ª semana, preg. 20","tipo":"examen","anio":2022,"convocatoria":"1","apartado":"Teorías cognitivas: teoría de prototipos","pagina_libro":184,"margen":"izquierdo","por_que":"a) Es al revés: varían según el contexto. c) Por tanto no son ambas correctas.","nota":"Misma pregunta que P60.","falsa":false,"verdaderas":{}},{"n":62,"enunciado":"En el procesamiento semántico, los resultados de Barsalou (1985) acerca de las categorías que construimos ad hoc orientadas a una meta, nos indican que:","opciones":["Los juicios de tipicidad no son fijos.","Los juicios de tipicidad no varían según el contexto.","Todas las opciones son correctas."],"correcta":1,"origen":"Examen 2025, 2.ª semana, preg. 5","tipo":"examen","anio":2025,"convocatoria":"2","apartado":"Teorías cognitivas: teoría de prototipos","pagina_libro":184,"margen":"izquierdo","por_que":"b) Es al revés: varían según el contexto. c) Por tanto no son ambas correctas.","nota":null,"falsa":false,"verdaderas":{}},{"n":63,"enunciado":"En la neuropsicología semántica, según la teoría sensoriofuncional:","opciones":["No hay diferencia cuando se procesa la información perceptiva y la funcional.","La estructura semántica crea el número mínimo de nodos sintácticos.","Hay diferencia cuando se procesa la información perceptiva y la funcional."],"correcta":3,"origen":"Examen 2013, 2.ª semana, preg. 5","tipo":"examen","anio":2013,"convocatoria":"2","apartado":"Teorías neurocognitivas","pagina_libro":185,"margen":"derecho","por_que":"a) Es al revés. b) No tiene que ver con nodos sintácticos. Los seres vivos se distinguen por rasgos perceptivos y los objetos por funcionales.","nota":null,"falsa":false,"verdaderas":{}},{"n":64,"enunciado":"A partir de los trastornos semánticos de categorías específicas, la teoría sensorialfuncional mantiene que:","opciones":["Los seres vivos están representados principalmente en base al conocimiento perceptual, mientras que los objetos se representan por el conocimiento funcional.","Los seres vivos y los artefactos están representados fundamentalmente por las características visuales que son las más susceptibles de deterioro.","Los datos de neuroimagen apoyan que, en el conocimiento de seres vivos como de artefactos, se activan las mismas regiones cerebrales."],"correcta":1,"origen":"Examen 2016, septiembre, preg. 16","tipo":"examen","anio":2016,"convocatoria":"S","apartado":"Teorías neurocognitivas","pagina_libro":185,"margen":"derecho","por_que":"b) No: los artefactos se distinguen por rasgos funcionales. c) Eso es un dato de neuroimagen contrario a la teoría del dominio específico, no lo que mantiene esta.","nota":null,"falsa":false,"verdaderas":{}},{"n":65,"enunciado":"La teoría sensoriofuncional del conocimiento semántico sostiene que:","opciones":["El sistema semántico está organizado en amplios dominios como consecuencia de la evolución.","Una lesión en la zona temporoocccipital dañará menos los rasgos perceptivos que los funcionales.","Una lesión en la zona temporooccipital dañará más a los seres vivos y a los instrumentos musicales que a los no vivos."],"correcta":3,"origen":"Examen 2017, 2.ª semana, preg. 3","tipo":"examen","anio":2017,"convocatoria":"2","apartado":"Teorías neurocognitivas","pagina_libro":186,"margen":"izquierdo","por_que":"a) Eso es la teoría del conocimiento específico de dominio. b) Es al revés: dañará más los rasgos perceptivos.","nota":null,"falsa":false,"verdaderas":{}},{"n":66,"enunciado":"De las teorías neurocognitivas sobre el procesamiento semántico, la teoría del conocimiento especifico de dominio fue propuesta por:","opciones":["Tyler y Moss (2001).","Warrington y McCarthy (1987).","Caramazza y Shelton (1998)."],"correcta":3,"origen":"Examen 2022, septiembre, preg. 13","tipo":"examen","anio":2022,"convocatoria":"S","apartado":"Teorías neurocognitivas","pagina_libro":186,"margen":"izquierdo","por_que":"a) Tyler y Moss propusieron la teoría conexionista. b) Warrington y McCarthy, la sensoriofuncional.","nota":null,"falsa":false,"verdaderas":{}},{"n":67,"enunciado":"La teoría del conocimiento específico de dominio, del procesamiento semántico, sostiene que:","opciones":["No existe una separación de categorías semánticas en el cerebro.","Existe un único sistema semántico sin separación en categorías.","El sistema semántico está organizado en amplios dominios como consecuencia de la evolución.","Existe una zona amodal en el cerebro donde están representados todos los conceptos."],"correcta":3,"origen":"Autoevaluación T5 (psicomagnum), preg. 4","tipo":"autoevaluacion","anio":null,"convocatoria":null,"apartado":"Teorías neurocognitivas","pagina_libro":186,"margen":"izquierdo","por_que":"a) Eso es la teoría sensoriofuncional. b) Eso es la conexionista. d) Eso es la teoría hub.","nota":null,"falsa":false,"verdaderas":{}},{"n":68,"enunciado":"La teoría del conocimiento específico de dominio sostiene que...","opciones":["Las redes neuronales de los conceptos se extienden por diferentes zonas cerebrales dependiendo de sus rasgos característicos.","La presión evolutiva condujo a adaptaciones específicas para las distintas categorías semánticas.","Todos los conceptos se encuentran distribuidos en una misma red.","Los conceptos están representados en función de sus rasgos característicos."],"correcta":2,"origen":"Autoevaluación T5 (psicomagnum), preg. 8","tipo":"autoevaluacion","anio":null,"convocatoria":null,"apartado":"Teorías neurocognitivas","pagina_libro":186,"margen":"derecho","por_que":"a) y d) son la teoría sensoriofuncional. c) Es la conexionista.","nota":null,"falsa":false,"verdaderas":{}},{"n":69,"enunciado":"La teoría del conocimiento específico de dominio en el procesamiento semántico no puede explicar que:","opciones":["La distinción entre los grandes dominios se produce en los primeros meses de vida del bebé.","La distinción entre los grandes dominios aparece en los primates superiores.","Todas las opciones son falsas."],"correcta":3,"origen":"Examen 2017, 2.ª semana, preg. 13","tipo":"examen","anio":2017,"convocatoria":"2","apartado":"Teorías neurocognitivas","pagina_libro":186,"margen":"derecho","por_que":"Las dos cosas sí las explica (son datos a favor de su carácter innato), así que ninguna de las opciones a) y b) es lo que no puede explicar.","nota":"Misma pregunta que P70.","falsa":false,"verdaderas":{}},{"n":70,"enunciado":"La teoría del conocimiento específico de dominio en el procesamiento semántico no puede explicar que:","opciones":["La distinción entre los grandes dominios se produce en los primeros meses de vida del bebé.","La distinción entre los grandes dominios aparece en los primates superiores.","Todas las opciones son falsas."],"correcta":3,"origen":"Examen 2018, 2.ª semana, preg. 21","tipo":"examen","anio":2018,"convocatoria":"2","apartado":"Teorías neurocognitivas","pagina_libro":186,"margen":"derecho","por_que":"Las dos cosas sí las explica (son datos a favor de su carácter innato), así que ninguna de las opciones a) y b) es lo que no puede explicar.","nota":"Misma pregunta que P69.","falsa":false,"verdaderas":{}},{"n":71,"enunciado":"La teoría del conocimiento específico de dominio en el procesamiento semántico no puede explicar que:","opciones":["La distinción entre los grandes dominios se produce en los primeros meses de vida del bebé.","La distinción entre los grandes dominios aparece en los primates superiores.","Todas las opciones son incorrectas."],"correcta":3,"origen":"Examen 2022, septiembre, preg. 15","tipo":"examen","anio":2022,"convocatoria":"S","apartado":"Teorías neurocognitivas","pagina_libro":186,"margen":"derecho","por_que":"Las dos cosas sí las explica (son datos a favor de su carácter innato), así que ninguna de las opciones a) y b) es lo que no puede explicar.","nota":null,"falsa":false,"verdaderas":{}},{"n":72,"enunciado":"Según la teoría conexionista propuesta porTylery Moss (2001) del procesamiento semántico, cuando se dañan los rasgos distintivos de los conceptos es más probable que resulten afectados:","opciones":["Los seres vivos.","Los seres inanimados.","El resto de los rasgos."],"correcta":1,"origen":"Examen 2025, 1.ª semana, preg. 18","tipo":"examen","anio":2025,"convocatoria":"1","apartado":"Teorías neurocognitivas","pagina_libro":187,"margen":"izquierdo","por_que":"b) Es al revés: en los objetos inanimados los rasgos distintivos resisten mejor. c) No es lo que dice la teoría.","nota":null,"falsa":false,"verdaderas":{}},{"n":73,"enunciado":"Según la teoría conexionista (Tyler y Moss, 2001) del procesamiento semántico, cuando se dañan los rasgos distintivos de los conceptos es menos probable que resulten afectados:","opciones":["Los seres inanimados.","Los seres vivos.","Los animales."],"correcta":1,"origen":"Examen 2023, 1.ª semana, preg. 9","tipo":"examen","anio":2023,"convocatoria":"1","apartado":"Teorías neurocognitivas","pagina_libro":187,"margen":"izquierdo","por_que":"b) y c) son más vulnerables, porque en los seres vivos los rasgos distintivos se relacionan poco con el resto.","nota":null,"falsa":false,"verdaderas":{}},{"n":74,"enunciado":"Las teorías corpóreas del significado (embodied) postulan diferentes distribuciones de los conceptos por el cerebro en función de:","opciones":["La representación amodal de los conceptos.","Las características perceptivas y motoras.","La representación en forma de proposiciones."],"correcta":2,"origen":"Examen 2020, 2.ª semana, preg. 27","tipo":"examen","anio":2020,"convocatoria":"2","apartado":"Bases neurológicas del sistema semántico","pagina_libro":187,"margen":"derecho","por_que":"a) y c) son representaciones abstractas, lo contrario de las teorías corpóreas.","nota":null,"falsa":false,"verdaderas":{}},{"n":75,"enunciado":"En el procesamiento semántico algunos autores como Damásio (1989) entienden que hay lugares en el cerebro en donde convergen informaciones sensoriales diferentes. En este sentido, la zona en la que convergen forma y color es esencial para el conocimiento de:","opciones":["los objetos","las frutas","los animales"],"correcta":2,"origen":"Examen 2022, 1.ª semana, preg. 2","tipo":"examen","anio":2022,"convocatoria":"1","apartado":"Bases neurológicas del sistema semántico","pagina_libro":191,"margen":"izquierdo","por_que":"a) Para los objetos hechos por el hombre convergen forma y acción. c) Para los animales, forma y movimiento.","nota":null,"falsa":false,"verdaderas":{}},{"n":76,"enunciado":"En la teoría hub o centro de actividad de Patterson y cols. (2007) sobre las redes neuronales y el procesamiento semántico se afirma que, además de las redes distribuidas, existe un centro responsable del conocimiento conceptual puro, siendo una zona:","opciones":["Específica de modalidad.","Motora.","Amodal."],"correcta":3,"origen":"Examen 2023, 1.ª semana, preg. 10","tipo":"examen","anio":2023,"convocatoria":"1","apartado":"Bases neurológicas del sistema semántico","pagina_libro":191,"margen":"derecho","por_que":"a) y b) no: el centro (hub) es amodal, independiente de la modalidad sensorial.","nota":"Misma pregunta que P77.","falsa":false,"verdaderas":{}},{"n":77,"enunciado":"En la teoría hub o centro de actividad de Patterson y cols. (2007) sobre las redes neuronales y el procesamiento semántico se afirma que, además de las redes distribuidas, existe un centro responsable del conocimiento conceptual puro, siendo una zona:","opciones":["Motora.","Específica de modalidad.","Amodal."],"correcta":3,"origen":"Examen 2025, septiembre, preg. 15","tipo":"examen","anio":2025,"convocatoria":"S","apartado":"Bases neurológicas del sistema semántico","pagina_libro":191,"margen":"derecho","por_que":"a) y b) no: el centro (hub) es amodal, independiente de la modalidad sensorial.","nota":"Misma pregunta que P76.","falsa":false,"verdaderas":{}},{"n":78,"enunciado":"¿Cuál de las siguientes zonas corticales no se activan siempre que se realizan tareas semánticas?","opciones":["Parte anterior de los dos lóbulos temporales.","Zona temporoparietal izquierda.","Zona prefrontal inferior izquierda.","Zona frontoparietal izquierda."],"correcta":4,"origen":"Autoevaluación T5 (psicomagnum), preg. 5","tipo":"autoevaluacion","anio":null,"convocatoria":null,"apartado":"Bases neurológicas del sistema semántico","pagina_libro":191,"margen":"derecho","por_que":"a), b) y c) son las tres zonas que siempre se activan en tareas semánticas. La frontoparietal no está entre ellas.","nota":null,"falsa":true,"verdaderas":{}},{"n":79,"enunciado":"La afirmación: “Sólo las zonas temporales anteriores corresponden al sistema semántico, y el área prefrontal inferior izquierda y el área temporoparietal izquierda son áreas ejecutivas que participan en el acceso al sistema semántico” se corresponde con autores que defienden el modelo:","opciones":["Basado en prototipos.","De conocimiento específico de dominio.","Centro de actividad o hub."],"correcta":3,"origen":"Examen 2019, septiembre, preg. 7","tipo":"examen","anio":2019,"convocatoria":"S","apartado":"Bases neurológicas del sistema semántico","pagina_libro":192,"margen":"izquierdo","por_que":"a) y b) son teorías que no distinguen zonas de acceso y zonas de conocimiento. Esa idea es de la teoría hub.","nota":null,"falsa":false,"verdaderas":{}},{"n":80,"enunciado":"Los experimentos de Marslen-Wilson y Welsh (1978) sobre la comprensión de la estructura de las frases demuestran que:","opciones":["Hasta que no acaba la cláusula estamos inactivos.","No anticipamos qué puede venir en la frase.","Intentamos integrar cada palabra en una representación semántica lo antes posible."],"correcta":3,"origen":"Examen 2012, septiembre, preg. 9","tipo":"examen","anio":2012,"convocatoria":"S","apartado":"Preguntas cuya respuesta no está en el capítulo 7","pagina_libro":null,"margen":null,"por_que":"a) y b) son lo contrario: integramos cada palabra en la representación semántica lo antes posible.","nota":"El experimento de Marslen-Wilson y Welsh (1978) no aparece en el capítulo 7; corresponde a otro capítulo del libro (comprensión de oraciones / reconocimiento de palabras). Respuesta según psicomagnum.","falsa":false,"verdaderas":{}},{"n":81,"enunciado":"En el estudio del lenguaje, una de las consecuencias de los modelos conexionistas es que nos ha obligado a analizar con detalle las representaciones utilizadas por el sistema del lenguaje. Identifique la alternativa correcta:","opciones":["En los modelos conexionistas las reglas están codificadas de manera explícita.","En estos modelos se accede a representaciones fijas en la mente de naturaleza abstracta y amodal.","Las reglas emergen como consecuencia de las generalizaciones estadísticas de los datos de entrada."],"correcta":3,"origen":"Examen 2015, 1.ª semana, preg. 7","tipo":"examen","anio":2015,"convocatoria":"1","apartado":"Preguntas cuya respuesta no está en el capítulo 7","pagina_libro":null,"margen":null,"por_que":"a) y b) describen los modelos simbólicos: en los conexionistas no hay reglas explícitas ni representaciones fijas.","nota":"El capítulo 7 no trata las reglas de los modelos conexionistas; la pregunta procede de otro capítulo. Respuesta según psicomagnum.","falsa":false,"verdaderas":{}}];
const COLORS = ["--c0","--c1","--c2","--c3","--c4","--c5","--c6","--c7"];
const L = "abcdefgh";
const CONV = {"1":"1.ª semana","2":"2.ª semana","S":"septiembre","R":"reserva"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let hist = {};
try { hist = JSON.parse(localStorage.getItem("lenguaje-t6-hist") || "{}"); } catch (e) { hist = {}; }
function saveHist() { try { localStorage.setItem("lenguaje-t6-hist", JSON.stringify(hist)); } catch (e) {} }

const apartados = [...new Set(Q.map(q => q.apartado))];
$("#f-ap").innerHTML = '<option value="">Todos los apartados</option>' + apartados.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join("");

const tag = (n, l) => `<span class="tag" style="background:var(${COLORS[(n - 1) % 8]})">P${n}${l ? "-" + l : ""}</span>`;

function stats() {
  const done = Q.filter(q => hist[q.n]);
  const ok = done.filter(q => hist[q.n].ok).length;
  const ex = Q.filter(q => q.tipo === "examen").length;
  $("#stats").innerHTML = `<span><b>${Q.length}</b> preguntas</span><span><b>${ex}</b> de exámenes 2012–2026</span><span><b>${Q.length - ex}</b> de autoevaluación</span>` +
    (done.length ? `<span>Tu último intento: <b>${ok}</b> de <b>${done.length}</b> acertadas</span>` : `<span>Aún no has hecho ningún test</span>`);
}

function filtered() {
  const ap = $("#f-ap").value, tipo = $("#f-tipo").value, est = $("#f-est").value;
  const term = $("#f-q").value.trim().toLowerCase();
  return Q.filter(q => (!ap || q.apartado === ap) && (!tipo || q.tipo === tipo) &&
    (!est || (est === "fallo" ? hist[q.n] && !hist[q.n].ok : !hist[q.n])) &&
    (!term || (q.enunciado + " " + q.opciones.join(" ") + " " + q.origen).toLowerCase().includes(term)));
}

function meta(q) {
  const kind = q.tipo === "examen" ? '<span class="pill ex">Examen</span>' : '<span class="pill au">Autoevaluación</span>';
  return `<div class="meta">${kind}${q.falsa ? '<span class="pill fa">Afirmación falsa</span>' : ""}<span>${esc(q.origen)}</span></div>`;
}

function explain(q) {
  const where = q.pagina_libro ? `<p class="where">Dónde está: pág. ${q.pagina_libro} del libro, margen ${q.margen} ${tag(q.n)}</p>` : `<p class="where">No está en el capítulo 7.</p>`;
  return `<div class="expl"><p><i>Por qué no las otras:</i> ${esc(q.por_que)}</p>${q.nota ? `<p class="nota"><i>Nota:</i> ${esc(q.nota)}</p>` : ""}${where}</div>`;
}

function optLabel(q, i) {
  let extra = "";
  if (q.falsa && i === q.correcta - 1) extra = " — es la afirmación falsa";
  else if (q.falsa && q.verdaderas && L[i] in q.verdaderas) extra = " — verdadera";
  return `<span class="l">${L[i]})</span><span>${esc(q.opciones[i])}${extra}</span>`;
}

/* ---------- Repasar ---------- */
function renderList() {
  const show = $("#f-show").checked;
  const qs = filtered();
  let html = `<p class="count">${qs.length} de ${Q.length} preguntas</p>`;
  if (!qs.length) html += `<p class="empty">Ninguna pregunta coincide con estos filtros. Prueba a quitar alguno.</p>`;
  let cur = null;
  for (const q of qs) {
    if (q.apartado !== cur) { cur = q.apartado; html += `<h2 class="section">${esc(cur)}</h2>`; }
    const opts = q.opciones.map((o, i) => `<li class="opt ${show && i === q.correcta - 1 ? "ok" : ""}">${optLabel(show ? q : { ...q, falsa: false }, i)}</li>`).join("");
    html += `<article class="q" data-n="${q.n}"><div class="qhead">${tag(q.n)}<div class="qtext">${esc(q.enunciado)}</div></div>${meta(q)}
      <ul class="opts">${opts}</ul>${show ? explain(q) : `<button class="reveal" data-n="${q.n}">Ver respuesta</button>`}</article>`;
  }
  $("#main").innerHTML = html;
}
$("#main").addEventListener("click", e => {
  const b = e.target.closest(".reveal");
  if (!b) return;
  const q = Q.find(x => x.n == b.dataset.n);
  const art = b.closest(".q");
  art.querySelectorAll(".opt")[q.correcta - 1].classList.add("ok");
  b.outerHTML = explain(q);
});

/* ---------- Test ---------- */
let test = null;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function startTest() {
  const pool = filtered();
  test = { items: shuffle(pool.slice()), i: 0, ok: 0, answered: false };
  renderTest();
}
function renderTest() {
  if (!test || !test.items.length) {
    $("#main").innerHTML = `<div class="test"><p class="empty">No hay preguntas con estos filtros. Cambia el apartado o el tipo para empezar un test.</p></div>`;
    return;
  }
  const { items, i } = test;
  if (i >= items.length) {
    const pct = Math.round(100 * test.ok / items.length);
    $("#main").innerHTML = `<div class="test"><div class="q result"><div class="eyebrow">Test terminado</div>
      <div class="big">${test.ok} / ${items.length}</div><p>${pct} % de aciertos</p>
      <div class="actions" style="justify-content:center"><button class="btn" id="again">Repetir con otras preguntas al azar</button>
      <button class="btn ghost" id="fails">Repasar las falladas</button></div></div></div>`;
    $("#again").onclick = startTest;
    $("#fails").onclick = () => { $("#f-est").value = "fallo"; setMode("list"); };
    stats();
    return;
  }
  const q = items[i];
  const opts = q.opciones.map((o, k) => `<li><button class="opt" data-k="${k}">${optLabel({ ...q, falsa: false }, k)}</button></li>`).join("");
  $("#main").innerHTML = `<div class="test">
    <div class="testbar"><span>Pregunta ${i + 1} de ${items.length}</span><span>Aciertos: ${test.ok}</span></div>
    <div class="progress"><span style="width:${100 * i / items.length}%"></span></div>
    <article class="q"><div class="qhead">${tag(q.n)}<div class="qtext">${esc(q.enunciado)}</div></div>${meta(q)}
    <ul class="opts" id="topts">${opts}</ul><div id="tfb"></div>
    <div class="actions"><button class="btn" id="next" hidden>Siguiente</button><button class="btn ghost" id="stop">Terminar test</button></div></article></div>`;
  test.answered = false;
  $("#topts").addEventListener("click", e => {
    const b = e.target.closest(".opt");
    if (!b || test.answered) return;
    test.answered = true;
    const k = +b.dataset.k, good = k === q.correcta - 1;
    if (good) test.ok++;
    hist[q.n] = { ok: good, t: Date.now() }; saveHist();
    document.querySelectorAll("#topts .opt").forEach((x, idx) => {
      x.disabled = true;
      if (idx === q.correcta - 1) x.classList.add("ok");
      else if (idx === k) x.classList.add("bad");
    });
    $("#tfb").innerHTML = explain(q);
    $("#next").hidden = false; $("#next").focus();
  });
  $("#next").onclick = () => { test.i++; renderTest(); };
  $("#stop").onclick = () => { test.items = test.items.slice(0, test.i + (test.answered ? 1 : 0)); test.i = test.items.length; renderTest(); };
}

/* ---------- modo ---------- */
let mode = "list";
function setMode(m) {
  mode = m;
  $("#tab-list").setAttribute("aria-pressed", m === "list");
  $("#tab-test").setAttribute("aria-pressed", m === "test");
  $("#chk-wrap").hidden = m === "test";
  if (m === "list") renderList(); else startTest();
}
$("#tab-list").onclick = () => setMode("list");
$("#tab-test").onclick = () => setMode("test");
for (const id of ["#f-ap", "#f-tipo", "#f-est", "#f-show"]) $(id).addEventListener("change", () => mode === "list" ? renderList() : startTest());
$("#f-q").addEventListener("input", () => mode === "list" ? renderList() : null);
stats();
setMode("test");
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
